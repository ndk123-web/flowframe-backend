[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

mongodb = "3.3"
bson = { version = "2.15", features = ["chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

tower-http = { version = "0.6", features = ["cors", "trace"] }

dotenvy = "0.15"

anyhow = "1"
jsonwebtoken = "9"
bcrypt = "0.15"